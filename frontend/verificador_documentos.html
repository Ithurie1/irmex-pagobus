<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IrMex - Verificar Documentos</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="app-container" style="max-width: 900px;">
        <div style="margin-bottom: 20px;">
            <a href="dashboard.html" style="text-decoration: none; color: var(--azul-medio); font-weight: bold;">← Volver al Inicio</a>
        </div>

        <h2 style="color: var(--azul-oscuro); margin-bottom: 20px;">Verificación de Renovaciones</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Bandeja de solicitudes pendientes de revisión de documentos.</p>

        <div style="overflow-x: auto;">
            <table class="tabla-datos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Correo</th>
                        <th>Fecha</th>
                        <th>Documento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaRenovaciones">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/verificador_documentos.js"></script>
</body>
</html>
