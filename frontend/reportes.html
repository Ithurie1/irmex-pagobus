<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IrMex - Reportes</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="display: flex; justify-content: center; align-items: flex-start !important; min-height: 100vh; background-color: #f4f7f6; margin: 0; font-family: Arial, sans-serif; padding: 40px 20px;">

    <div class="app-container" style="max-width: 700px; width: 100%; background-color: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        
        <a href="dashboard.html" style="text-decoration: none; color: var(--azul-medio); font-weight: bold; background-color: #e8f4fd; padding: 8px 12px; border-radius: 8px;">
            ← Volver al Inicio
        </a>
        
        <h2 style="color: var(--azul-oscuro); margin-top: 25px; text-align: center;">📊 Dashboard de Administración</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Métricas en tiempo real y auditoría del sistema.</p>

        <div class="grid-reportes" id="contenedorMetricas">
            <div class="card-metrica"><p>⏳ Cargando...</p></div>
        </div>

        <div class="seccion-admin">
            <h3 style="color: #2c3e50; margin-top: 0; text-align: center;">Flujo Financiero</h3>
            <canvas id="graficaFinanzas" style="max-height: 250px; width: 100%;"></canvas>
        </div>

        <div class="seccion-admin">
            <h3 style="color: #2c3e50; margin-top: 0; margin-bottom: 5px;">🛡️ Auditoría de Accesos</h3>
            <p style="font-size: 13px; color: #7f8c8d; margin-bottom: 15px;">Registro de los últimos 50 inicios de sesión exitosos.</p>
            
            <div style="max-height: 250px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                    <thead style="position: sticky; top: 0; background-color: #f8f9fa; z-index: 5;">
                        <tr>
                            <th style="padding: 12px 15px; border-bottom: 2px solid #e2e8f0; color: #2c3e50;">Usuario (Correo)</th>
                            <th style="padding: 12px 15px; border-bottom: 2px solid #e2e8f0; color: #2c3e50;">Fecha y Hora</th>
                        </tr>
                    </thead>
                    <tbody id="tablaLogs">
                        <tr><td colspan="2" style="padding: 15px; text-align: center; color: #7f8c8d;">Cargando bitácora...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="/static/js/reportes.js"></script>
</body>
</html>
