<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IrMex - Gestor de Estudiantes</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="panel-interno">
        <div class="header-interno">
            <a href="dashboard.html" class="btn-regresar">⬅ Volver al Dashboard</a>
        </div>

        <h2 style="color: var(--azul-oscuro); margin-bottom: 5px;">Directorio de Estudiantes</h2>
        <p style="color: #666; margin-bottom: 20px; font-size: 14px;">Busca y administra a los estudiantes y sus tarjetas vinculadas.</p>

        <input type="text" id="buscador" class="search-bar" placeholder="Buscar por nombre o correo...">

        <div style="overflow-x: auto;">
            <table id="tablaEstudiantes">
                <thead>
                    <tr>
                        <th>Matrícula/ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Estatus Tarjeta</th>
                        <th>Nivel de Acceso</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <!-- Llenado dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/verificar_estatus.js?v=999"></script>
</body>
</html>
