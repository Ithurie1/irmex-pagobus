<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón de Soporte - IrMex Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px;">

    <div class="header">
        <h2 style="margin:0;">Centro de Soporte y Auditoría IrMex</h2>
        <button onclick="window.location.href='dashboard.html'" style="padding: 10px; cursor:pointer; background:#f39c12; color:white; border:none; border-radius:5px; font-weight:bold;">Volver al Menu</button>
    </div>

    <div class="buzon-container">
        <div class="sidebar-buzon">
            <button onclick="cargarTicketsBuzon('todos')">📥 Bandeja de Entrada</button>
            <button onclick="cargarTicketsBuzon('importantes')">⭐ Destacados</button>
        </div>

        <div id="listaTickets">
            <p>Cargando mensajes...</p>
        </div>
    </div>

    <div id="modalResponder" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
            <h3 id="modalAsunto" style="margin-top: 0; color: #2c3e50;">Asunto</h3>
            
            <p style="margin-bottom: 5px; color: #7f8c8d; font-size: 14px;">Mensaje del estudiante:</p>
            <div id="modalMensaje" style="background: #f4f7f6; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #3498db; min-height: 60px;"></div>
            
            <p style="margin-bottom: 5px; color: #7f8c8d; font-size: 14px;">Escribe tu respuesta:</p>
            <textarea id="textoRespuesta" rows="5" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; resize: none;" placeholder="Hola, tu caso ya fue revisado..."></textarea>
            
            <input type="hidden" id="ticketIdOculto">
            
            <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                <button onclick="cerrarModalResponder()" style="padding: 10px 15px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancelar</button>
                <button onclick="enviarRespuesta()" style="padding: 10px 15px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Enviar Respuesta</button>
            </div>
        </div>
    </div>

    <script src="/static/js/buzon_admin.js"></script>
</body>
</html>
