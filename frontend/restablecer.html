<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - IrMex</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0;">
    <div class="card">
        <h2 style="color: #2c3e50; margin-top:0;">Crea tu nueva contraseña</h2>
        <p style="color: #7f8c8d; font-size: 14px;" id="lblCorreo">Validando usuario...</p>
        
        <form id="formReset">
            <div style="text-align: left;">
                <label style="color: #64748b; font-size: 14px; font-weight: bold;">Nueva contraseña:</label>
                <input type="password" id="pass1" placeholder="Mínimo 8 caracteres" required style="width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                
                <label style="color: #64748b; font-size: 14px; font-weight: bold;">Confirma tu contraseña:</label>
                <input type="password" id="pass2" placeholder="Repite la contraseña" required style="width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Actualizar Contraseña</button>
        </form>
    </div>

    <script src="/static/js/restablecer.js"></script>
</body>
</html>
